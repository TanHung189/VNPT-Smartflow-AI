# ================================================================
# VNPT SmartFlow AI — GitHub Actions CI/CD Pipeline
#
# Kích hoạt: Mỗi khi push hoặc tạo Pull Request vào nhánh main/develop
# Luồng:
#   1. Backend CI: Lint (Ruff) → Type check → Unit Tests → Coverage Report
#   2. Docker Build: Verify image build thành công
# ================================================================

name: CI — Backend Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Hủy pipeline cũ nếu push mới vào cùng branch (tiết kiệm resource)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # JOB 1: Backend — Lint + Test + Coverage
  # ──────────────────────────────────────────────────────────────
  backend-ci:
    name: "Backend — Lint & Test"
    runs-on: ubuntu-latest

    # Services: Redis cho test (PostgreSQL thay bằng SQLite trong test)
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      # Biến môi trường cho test (KHÔNG dùng secrets thật)
      DATABASE_URL: "sqlite+aiosqlite:///./test.db"
      REDIS_URL: "redis://localhost:6379/0"
      GEMINI_API_KEYS: "fake-key-for-ci-testing"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      SENTRY_DSN: ""
      GOOGLE_CLIENT_ID: "fake-client-id"
      GOOGLE_CLIENT_SECRET: "fake-client-secret"

    steps:
      # 1. Checkout source code
      - name: "📥 Checkout source code"
        uses: actions/checkout@v4

      # 2. Cài đặt Python 3.12
      - name: "🐍 Setup Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      # 3. Cài dependencies
      - name: "📦 Install dependencies"
        run: pip install -r requirements.txt aiosqlite

      # 4. Ruff Linting — Kiểm tra code style và lỗi tiềm ẩn
      - name: "🔍 Ruff — Lint check"
        run: ruff check app/ --output-format=github
        continue-on-error: false  # DỪNG pipeline nếu có lỗi lint nghiêm trọng

      # 5. Ruff Format check — Kiểm tra format code
      - name: "✨ Ruff — Format check"
        run: ruff format app/ --check
        continue-on-error: true  # Cảnh báo nhưng không dừng (format là soft rule)

      # 6. Chạy Unit Tests với Coverage
      - name: "🧪 Pytest — Run tests with coverage"
        run: |
          pytest \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            -v

      # 7. Upload Coverage Report lên Codecov (hiển thị badge trên README)
      - name: "📊 Upload coverage to Codecov"
        uses: codecov/codecov-action@v4
        if: always()  # Upload dù test pass hay fail
        with:
          file: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false  # Không dừng CI nếu Codecov lỗi

      # 8. Tóm tắt kết quả test
      - name: "📝 Test Summary"
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Completed at: $(date)" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────
  # JOB 2: Docker Build — Verify image build thành công
  # Chỉ chạy khi push vào nhánh main (không chạy với PR)
  # ──────────────────────────────────────────────────────────────
  docker-build:
    name: "Docker — Build Verification"
    runs-on: ubuntu-latest
    needs: backend-ci  # Chỉ build Docker nếu CI pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: "📥 Checkout source code"
        uses: actions/checkout@v4

      - name: "🐳 Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3

      # Build Backend image (không push, chỉ verify build OK)
      - name: "🔨 Build Backend Docker image"
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: vnpt-smartflow-backend:ci-${{ github.sha }}

      # Build Frontend image
      - name: "🔨 Build Frontend Docker image"
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          build-args: |
            REACT_APP_API_BASE_URL=http://localhost:8000/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: vnpt-smartflow-frontend:ci-${{ github.sha }}

      - name: "✅ Build Summary"
        run: |
          echo "## 🐳 Docker Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- Backend image: ✅ Build successful" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend image: ✅ Build successful" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
