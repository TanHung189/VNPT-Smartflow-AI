server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # React Router SPA fallback — serve index.html for all routes
        try_files $uri $uri/ /index.html;

        # FIX: Cho phép Google Login popup giao tiếp với trang viên
        # qua window.postMessage trong môi trường đóng gói Docker (Nginx).
        add_header "Cross-Origin-Opener-Policy" "unsafe-none" always;
        add_header "Cross-Origin-Embedder-Policy" "unsafe-none" always;
    }

    location /static/ {
        # Cache static assets for 1 year
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API calls to backend (optional, uncomment if using same host)
    # location /api/ {
    #     proxy_pass http://backend:8000;
    # }
}
