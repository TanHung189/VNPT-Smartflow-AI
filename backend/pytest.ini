[pytest]
# ── Cấu hình pytest cho VNPT SmartFlow AI Backend ──────────────

# Đường dẫn tìm test
testpaths = tests

# Asyncio mode: auto = tự động xử lý async test mà không cần decorator bổ sung
asyncio_mode = auto

# Hiển thị log trong quá trình test
log_cli = true
log_cli_level = WARNING
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %H:%M:%S

# Hiển thị chi tiết hơn khi có lỗi
addopts =
    -v
    --tb=short
    --strict-markers

# ⚠️ Ghi chú: --cov đã bị xóa khỏi addopts
# Chạy với coverage: pytest --cov=app --cov-report=term-missing
# Lý do: Chạy --cov mặc định gây lỗi nếu chưa có aiosqlite

# Custom markers
markers =
    slow: Đánh dấu test chậm (chạy khi có flag --runslow)
    integration: Test tích hợp cần external services
    unit: Unit test thuần túy (nhanh, không cần external)
