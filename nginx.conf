server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Redirect tất cả HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL Certificate (Certbot sẽ tự động điền vào đây)
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Frontend (React App) ──────────────────────────────────────
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;

        # Headers bảo mật
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "no-referrer-when-downgrade";

        # Header quan trọng cho Google OAuth popup
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups";
    }

    # ── Backend API (FastAPI) ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout cho AI tasks (có thể chạy lâu)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Flower (Celery Monitor) — chặn từ public, chỉ local ──────
    location /flower/ {
        deny all;
        # Nếu muốn mở: allow YOUR_ADMIN_IP; deny all;
    }

    # Giới hạn upload size (cho file upload AI)
    client_max_body_size 50M;
}
